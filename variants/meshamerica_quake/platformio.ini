;
; Mesh America Quake Repeater firmware images. Everything specific to this product lives in this
; file (and src/helpers/sensors/D7S*), so Keymind Cascade updates merge without touching it.
; Images are isolated from Keymind's: own environment name, hence its own OTA target id.
;
; RAK3401 (RAK19007 + RAK4631 + RAK13302 1 W radio) with a RAK12027 earthquake sensor in sensor
; slot A. Lean, LoRa-OTA-capable repeater: the optional external environmental sensors are
; trimmed; INA monitors, display/RTC and GPS support remain.
[env:MeshAmerica_Quake_Repeater_RAK3401]
extends = rak3401
extra_scripts = ${nrf52_lora_ota.extra_scripts}
  post:variants/rak3401/fix_bsec_lib.py
build_flags =
  ${rak3401.build_flags}
  ${nrf52_reduced_sensors_keep_ina_gps.build_flags}
  -D ENV_INCLUDE_D7S=1
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Quake Repeater"'
  -D FIRMWARE_PRODUCT='"Quake Repeater"'   ; what `ver` calls this firmware
  -D FIRMWARE_VERSION='"v1.17.1.6"'      ; the release tag is quake-v<this>; bump it for every release
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D ENABLE_OTA=1
  -D OTA_FLASH_STORE=1
  -D OTA_FOLDER_SERIAL
  -D OTA_TARGET_NAME_TABLE=0              ; IDs remain authoritative; omit the display-name table
  -D OTA_LOCAL_TARGET_ID=0x7763803b      ; first 4 bytes (LE) of sha256("MeshAmerica_Quake_Repeater_RAK3401")
  -D OTA_LOCAL_TARGET_NAME='"MeshAmerica_Quake_Repeater_RAK3401"'
  -D OTA_FETCH_PIPELINE=4
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ota/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${nrf52_lora_ota.lib_deps}
  ${nrf52_reduced_sensors_keep_ina_gps.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27

; RAK4631 on a RAK19003 mini base (or any other WisBlock base that fits a RAK4631) with a RAK12027
; earthquake sensor: the RAK10703 earthquake sensor kit, or the same parts bought separately. Same
; firmware as the RAK3401 image, for the RAK4631's own 22 dBm SX1262 (no external amplifier).
; ALPHA: not yet run on this hardware. On a RAK19003 the sensor goes in slot C or D, where its
; INT2 is on IO4 or IO6, so the shared IO2 (3V3_S enable) is left driven high, which also keeps the
; sensor powered (see D7SBoard.h and docs/d7s-integration.md).
[env:MeshAmerica_Quake_Repeater_RAK4631]
extends = rak4631
extra_scripts = ${nrf52_lora_ota.extra_scripts}
  post:variants/rak4631/fix_bsec_lib.py
build_flags =
  ${rak4631.build_flags}
  ${nrf52_reduced_sensors_keep_ina_gps.build_flags}
  -D ENV_INCLUDE_D7S=1
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Quake Repeater"'
  -D FIRMWARE_PRODUCT='"Quake Repeater"'   ; what `ver` calls this firmware
  -D FIRMWARE_VERSION='"v1.17.1.6"'      ; keep in step with the RAK3401 image: one release carries both
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D ENABLE_OTA=1
  -D OTA_FLASH_STORE=1
  -D OTA_FOLDER_SERIAL
  -D OTA_TARGET_NAME_TABLE=0              ; IDs remain authoritative; omit the display-name table
  -D OTA_LOCAL_TARGET_ID=0x2448e94c       ; first 4 bytes (LE) of sha256("MeshAmerica_Quake_Repeater_RAK4631")
  -D OTA_LOCAL_TARGET_NAME='"MeshAmerica_Quake_Repeater_RAK4631"'
  -D OTA_FETCH_PIPELINE=4
build_src_filter = ${rak4631.build_src_filter}
  +<helpers/ota/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${nrf52_lora_ota.lib_deps}
  ${nrf52_reduced_sensors_keep_ina_gps.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
