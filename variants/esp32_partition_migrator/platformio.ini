; Board-independent ESP32-S3 Wi-Fi bridge for 4 MiB dual-OTA nodes. This
; utility uses Wi-Fi, NVS and SPIFFS only; no board GPIO or PSRAM is needed.
; DIO and disabled USB CDC minimize board-specific boot assumptions.
[env:esp32_s3_4mb_partition_migrator]
platform = platformio/espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
extra_scripts =
  pre:scripts/esp32_wifi_scan_fix.py
  post:scripts/check_firmware_ram.py
build_flags =
  -D ESP32_PLATFORM
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D MESH_MIN_RUNTIME_HEAP=100352
  -I src
build_src_filter =
  -<*>
  +<../examples/esp32_partition_migrator>
lib_deps =
  ESP32Async/AsyncTCP @ 3.5.0
  ESP32Async/ESPAsyncWebServer @ 3.12.0
  file://arch/esp32/AsyncElegantOTA

; The same board-independent bridge with a 16 MiB app image header. The
; source updater still sees Arduino default.csv's 1.25 MiB slots.
[env:esp32_s3_16mb_partition_migrator]
extends = env:esp32_s3_4mb_partition_migrator
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

[env:esp32_s3_8mb_partition_migrator]
extends = env:esp32_s3_4mb_partition_migrator
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; LoRa first-stage variants derive the exact board/role target from the EndF
; appended by the packager and verify the old receiver's EndF before changing
; flash. The bridge itself uses no board-specific radio GPIO.
[env:esp32_s3_4mb_partition_migrator_lora]
extends = env:esp32_s3_4mb_partition_migrator
build_flags =
  ${env:esp32_s3_4mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_RESUME_OTA=1

[env:esp32_s3_8mb_partition_migrator_lora]
extends = env:esp32_s3_8mb_partition_migrator
build_flags =
  ${env:esp32_s3_8mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_RESUME_OTA=1

[env:esp32_s3_16mb_partition_migrator_lora]
extends = env:esp32_s3_16mb_partition_migrator
build_flags =
  ${env:esp32_s3_16mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_RESUME_OTA=1

; Heltec V2 and other first-generation ESP32 (non-S3) 8 MiB boards need a
; matching chip-family image. The migration logic still verifies the live
; partition table and flash size before touching flash.
[env:esp32_8mb_partition_migrator]
extends = env:esp32_s3_8mb_partition_migrator
board = esp32dev

[env:esp32_8mb_partition_migrator_lora]
extends = env:esp32_8mb_partition_migrator
build_flags =
  ${env:esp32_8mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_RESUME_OTA=1

; The 4 MiB C3 bridge covers historical default.csv images such as the
; Heltec CT62. It never assumes the old app slots are exactly 1.25 MiB: the
; live table must still pass the common geometry and identity checks.
[env:esp32_c3_4mb_partition_migrator]
extends = env:esp32_s3_4mb_partition_migrator
board = esp32-c3-devkitm-1

[env:esp32_c3_4mb_partition_migrator_lora]
extends = env:esp32_c3_4mb_partition_migrator
build_flags =
  ${env:esp32_c3_4mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_RESUME_OTA=1

[env:esp32_4mb_partition_migrator]
extends = env:esp32_s3_4mb_partition_migrator
board = esp32dev

[env:esp32_4mb_partition_migrator_lora]
extends = env:esp32_4mb_partition_migrator
build_flags =
  ${env:esp32_4mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_RESUME_OTA=1

; USB host-managed first stages are deliberately separate from the Wi-Fi
; bridges above. Native application CDC stays disabled during flash-table
; edits; S3/C3 return to ROM after restoration settles and classic ESP32
; reports settled UART status before host-driven DTR/RTS bootloader entry.
; Raw restoration proof is still required. No physical BOOT is needed for
; stage two. USB_MODE=0 selects TinyUSB, but all ON_BOOT flags remain off
; and this utility never starts application USB. The S3 recovery helper
; explicitly restores hardware USB/JTAG routing before ROM entry.
; Classic ESP32 uses its existing external UART.
[env:esp32_s3_4mb_partition_migrator_usb]
extends = env:esp32_s3_4mb_partition_migrator
extra_scripts =
  ${env:esp32_s3_4mb_partition_migrator.extra_scripts}
  pre:scripts/esp32_partition_migration_nvs_guard.py
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  ${env:esp32_s3_4mb_partition_migrator.build_flags}
  -D ARDUINO_USB_MODE=0
  -D MESHCORE_MIGRATION_USB=1

[env:esp32_s3_8mb_partition_migrator_usb]
extends = env:esp32_s3_8mb_partition_migrator
extra_scripts =
  ${env:esp32_s3_4mb_partition_migrator.extra_scripts}
  pre:scripts/esp32_partition_migration_nvs_guard.py
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  ${env:esp32_s3_8mb_partition_migrator.build_flags}
  -D ARDUINO_USB_MODE=0
  -D MESHCORE_MIGRATION_USB=1

[env:esp32_s3_16mb_partition_migrator_usb]
extends = env:esp32_s3_16mb_partition_migrator
extra_scripts =
  ${env:esp32_s3_4mb_partition_migrator.extra_scripts}
  pre:scripts/esp32_partition_migration_nvs_guard.py
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  ${env:esp32_s3_16mb_partition_migrator.build_flags}
  -D ARDUINO_USB_MODE=0
  -D MESHCORE_MIGRATION_USB=1

[env:esp32_4mb_partition_migrator_usb]
extends = env:esp32_4mb_partition_migrator
extra_scripts =
  ${env:esp32_s3_4mb_partition_migrator.extra_scripts}
  pre:scripts/esp32_partition_migration_nvs_guard.py
build_flags =
  ${env:esp32_4mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_USB=1

[env:esp32_8mb_partition_migrator_usb]
extends = env:esp32_8mb_partition_migrator
extra_scripts =
  ${env:esp32_s3_4mb_partition_migrator.extra_scripts}
  pre:scripts/esp32_partition_migration_nvs_guard.py
build_flags =
  ${env:esp32_8mb_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_USB=1

[env:esp32_c3_4mb_partition_migrator_usb]
extends = env:esp32_c3_4mb_partition_migrator
extra_scripts =
  ${env:esp32_s3_4mb_partition_migrator.extra_scripts}
  pre:scripts/esp32_partition_migration_nvs_guard.py
build_flags =
  ${env:esp32_c3_4mb_partition_migrator.build_flags}
  -D ARDUINO_USB_MODE=0
  -D MESHCORE_MIGRATION_USB=1
