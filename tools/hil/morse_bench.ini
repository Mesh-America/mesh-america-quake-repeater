; Companion applications, with no automatic RF at boot. LoRa control uses the
; lab tuple 909.5/500/SF5/CR5; Morse uses its separate 902.100 MHz default.
; The 255 WPM override is EXPERIMENTAL, never a release or measured guarantee.
[env:morse_bench_rak4631_companion]
extends = env:RAK_4631_companion_radio_usb
build_unflags =
  ${nrf52_base.build_unflags}
  -D LORA_FREQ=869.618
  -D ENABLE_ADVERT_ON_BOOT=1
build_flags = ${env:RAK_4631_companion_radio_usb.build_flags}
  -DLORA_FREQ=909.5
  -DENABLE_ADVERT_ON_BOOT=0
  -DMESH_MORSE_MAX_WPM=255
  -DMESH_MORSE_HIL=1
  -DMESH_MORSE_HIL_WARM_TX=1
  -DMESH_MORSE_HIL_RSSI_WINDOW=2
  -DMESH_MORSE_HIL_PA_RAMP_US=800
  -DMESH_MORSE_HIL_SAMPLE_INTERVAL_MS=1
  -DMESH_MORSE_HIL_PACKET_GATING=0
  -DMESH_MORSE_HIL_FAST_OFF_DEBOUNCE=1
  -DCOMPANION_FEATURE_TEMP_RADIO=1
build_src_filter = ${env:RAK_4631_companion_radio_usb.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>

