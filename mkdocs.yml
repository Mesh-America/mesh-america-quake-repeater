site_name: MeshCore Docs
site_url: !ENV [MKDOCS_SITE_URL, 'https://meshcore-dev.github.io/meshcore/']
site_description: Documentation for the open source MeshCore firmware

repo_name: !ENV [MKDOCS_REPO_NAME, 'meshcore-dev/meshcore']
repo_url: !ENV [MKDOCS_REPO_URL, 'https://github.com/meshcore-dev/meshcore/']
edit_uri: !ENV [MKDOCS_EDIT_URI, 'edit/main/docs/']

# Keep historical URLs for bookmarks while showing only the organized copies.
not_in_nav: |
  /*_validation.md
  /*_results.md
  /*_audit.md
  /*_investigation.md
  /*_trial.md
  /hardware_validation_checklist.md
  /home_text_spacing.md
  /mbedtls-tls-footprint.md
  /nrf52_companion_storage_recovery.md
  /nrf52-usb-ready-fix.md
  /radio_receive_calibration.md
  /spiffs_regular_file_reads.md
  /usb_serial_backpressure.md
  /v4_pixel5_font_trial.md
  /releases/1.17.1.5-doc-audit.md
  /releases/1.17.1.5.md
  /releases/1.17.1.6.md
  /releases/1.17.1.7.md

theme:
  name: material
  logo: _assets/meshcore.svg
  features:
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - _stylesheets/notification_builder.css
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - _stylesheets/extra.css
  - _stylesheets/firmware_picker.css?v=20260929-1
  - _stylesheets/telemetry_decoder.css
  - _stylesheets/management_decoder.css
  - _stylesheets/filter_tool.css
  - _stylesheets/preset_test.css?v=20260923-2

extra_javascript:
  - _javascript/notification_builder.js?v=20260930-audio-start
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - _javascript/firmware_picker.js?v=20260929-4
  - _javascript/telemetry_decoder.js
  - _javascript/management_decoder.js
  - _javascript/filter_tool.js
  - _javascript/preset_test.js?v=20260923-2
