name: Quake Repeater docs site

# Builds the Mesh America Quake Repeater documentation (mkdocs-quake.yml, assembled by
# scripts/build_quake_site.py) and publishes it to GitHub Pages from main. Pull requests build it
# (in strict mode, so a broken link fails) but do not publish. Separate from github-pages.yml, which
# builds Keymind's inherited site.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/earthquake-alerts.md'
      - 'docs/reading-the-sensor.md'
      - 'docs/clock-floor.md'
      - 'docs/d7s-integration.md'
      - 'docs/d7s-measurement-contract.md'
      - 'quake-docs/**'
      - 'mkdocs-quake.yml'
      - 'scripts/build_quake_site.py'
      - '.github/workflows/quake-docs-pages.yml'
  pull_request:
    paths:
      - 'docs/earthquake-alerts.md'
      - 'docs/reading-the-sensor.md'
      - 'docs/clock-floor.md'
      - 'docs/d7s-integration.md'
      - 'docs/d7s-measurement-contract.md'
      - 'quake-docs/**'
      - 'mkdocs-quake.yml'
      - 'scripts/build_quake_site.py'
      - '.github/workflows/quake-docs-pages.yml'

permissions:
  contents: read

concurrency:
  group: quake-docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build the site
        run: |
          pip install mkdocs-material
          python scripts/build_quake_site.py

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-quake

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
