name: Quake Repeater Build and Release

# Builds the Mesh America Quake Repeater images (RAK3401 and RAK4631, the only firmware this repository
# ships), checks them, and on a tag publishes one GitHub release carrying both for the web flasher to
# pick up. Both images carry the same version (FIRMWARE_VERSION in variants/meshamerica_quake/platformio.ini
# is set in each environment): the release fails if they differ.
#
#   pull request / push to next  ->  build and verify only
#   push to main                 ->  build and verify, then, if the version inside the image has no
#                                    release yet, create the tag quake-vX.Y.Z.W and a release
#   tag quake-vX.Y.Z.W           ->  build, verify, then create a release (manual tagging)
#   manual run                   ->  build and verify, upload the result as a workflow artifact
#
# Work lands on `next`; a pull request from `next` to `main` is the release. The tag always names
# the version inside the image (quake-v1.17.1.0 for firmware 1.17.1.0): a pushed tag that does not
# match fails the run, and on main the tag is derived from the image, so it cannot mismatch. Bump
# FIRMWARE_VERSION in variants/meshamerica_quake/platformio.ini to release; a push to main that
# does not bump it publishes nothing.

on:
  pull_request:
    branches: [main, next]
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'examples/**'
      - 'variants/**'
      - 'boards/**'
      - 'arch/**'
      - 'scripts/**'
      - 'test/test_quake_release_manifest.py'
      - 'platformio.ini'
      - 'requirements-build.txt'
      - '.github/workflows/quake-repeater-release.yml'
  # No path filter on push: GitHub does not reliably apply one to tag pushes, and a release that
  # silently fails to start is worse than one extra build of main.
  push:
    branches: [main, next]
    tags: ['quake-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quake-repeater-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The first board keeps the manifest name the flasher's earlier releases used.
          - env: MeshAmerica_Quake_Repeater_RAK3401
            manifest: manifest.json
          - env: MeshAmerica_Quake_Repeater_RAK4631
            manifest: manifest-MeshAmerica_Quake_Repeater_RAK4631.json
    env:
      PIO_ENV: ${{ matrix.env }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Init Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-quake-${{ matrix.env }}

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # intelhex is imported by the nRF52 packaging step that turns the build into the DFU zip. It is
      # not in requirements-build.txt, and without it that step fails with "No module named 'intelhex'".
      - name: Install PlatformIO and build dependencies
        run: |
          pip install --upgrade platformio -r requirements-build.txt intelhex==2.3.0
          python -c "import intelhex; print('intelhex importable from', intelhex.__file__)"

      - name: Test the release manifest script
        run: python3 -B test/test_quake_release_manifest.py -v

      - name: Build firmware
        run: pio run -e "$PIO_ENV"

      - name: Verify the package and write the manifest
        run: |
          TAG_ARGS=()
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_ARGS=(--tag "${GITHUB_REF_NAME}")
          fi
          python3 scripts/quake_release_manifest.py \
            --zip ".pio/build/${PIO_ENV}/firmware.zip" \
            --hex ".pio/build/${PIO_ENV}/firmware.hex" \
            --env "$PIO_ENV" \
            --commit "$GITHUB_SHA" \
            "${TAG_ARGS[@]}" \
            --manifest-name "${{ matrix.manifest }}"             --out dist

      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: quake-repeater-release-${{ matrix.env }}
          path: dist
          if-no-files-found: error

  release:
    # For a quake tag, or a push to main (which tags the version in the image if it is new).
    # Everything above has already passed, including the check that a tag names the version inside
    # the image.
    if: startsWith(github.ref, 'refs/tags/quake-v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build result
        uses: actions/download-artifact@v8
        with:
          pattern: quake-repeater-release-*
          merge-multiple: true
          path: dist

      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="quake-v$(python3 -c 'import json; print(json.load(open("dist/manifest.json"))["version"])')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # The web flasher requires each manifest to name its release tag. On main the manifests were
          # built before the tag was known, so record it now. Every image in a release must carry the
          # same version.
          TAG="$TAG" python3 - <<'PY'
          import glob, json, os
          paths = sorted(glob.glob("dist/manifest*.json"))
          manifests = {p: json.load(open(p)) for p in paths}
          versions = {m["version"] for m in manifests.values()}
          if len(manifests) < 2 or len(versions) != 1:
              raise SystemExit(f"::error::expected one manifest per image, all with the same version; found {len(manifests)} with versions {sorted(versions)}")
          for path, m in manifests.items():
              m["tag"] = os.environ["TAG"]
              json.dump(m, open(path, "w"), indent=2)
          PY
          if [[ "${GITHUB_REF}" != refs/tags/* ]] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY' > notes.md
          import glob, json
          BOARDS = {
              "MeshAmerica_Quake_Repeater_RAK3401": "RAK3401 (RAK12027 earthquake sensor in sensor slot A)",
              "MeshAmerica_Quake_Repeater_RAK4631": "RAK4631 on a RAK19003 base (RAK12027 in sensor slot D, as in the RAK10703 earthquake sensor kit). ALPHA: not yet run on this hardware",
          }
          manifests = [json.load(open(p)) for p in sorted(glob.glob("dist/manifest*.json"))]
          manifests.sort(key=lambda m: m["env"])
          print(f"Mesh America Quake Repeater firmware {manifests[0]['version']}.")
          print()
          print("Install it with the web flasher at https://apps.meshamerica.com/quake-repeater/, which also has the over-the-air update files and a guide. Already running this firmware? The same page configures it over USB.")
          for m in manifests:
              print()
              print(f"### {BOARDS.get(m['env'], m['env'])}")
              print()
              print(f"- Package: `{m['package']['file']}` ({m['package']['size']} bytes)")
              print(f"- SHA-256: `{m['package']['sha256']}`")
              if "hex" in m:
                  print(f"- Firmware image: `{m['hex']['file']}` ({m['hex']['size']} bytes), SHA-256 `{m['hex']['sha256']}`. Keep it: updating a node over LoRa (OTA) is built from the new `.hex` and, for a delta, from the `.hex` the node runs now.")
              print(f"- OTA target id: `{m['targetId']}`, hardware tag `{m['hardwareId']}`")
          print()
          print(f"Built from commit `{manifests[0]['commit']}`")
          PY
          # A pushed tag already exists. On main, creating the release creates the tag at this commit.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_FLAGS=(--verify-tag)
          else
            TAG_FLAGS=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" dist/*.zip dist/*.hex dist/manifest*.json \
            --repo "$GITHUB_REPOSITORY" \
            "${TAG_FLAGS[@]}" \
            --latest \
            --generate-notes \
            --title "Quake Repeater ${TAG#quake-v}" \
            --notes-file notes.md
