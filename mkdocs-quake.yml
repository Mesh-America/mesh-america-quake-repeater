# Mesh America Quake Repeater documentation site. Built by scripts/build_quake_site.py (which
# assembles .quake-site/ from quake-docs/ and docs/) and published by
# .github/workflows/quake-docs-pages.yml. Separate from mkdocs.yml, which is Keymind's site.
site_name: Mesh America Quake Repeater
site_url: https://quakerepeater.meshamerica.com/
site_description: Documentation for the Mesh America Quake Repeater, a LoRa mesh repeater with an earthquake sensor.

repo_name: Mesh-America/mesh-america-quake-repeater
repo_url: https://github.com/Mesh-America/mesh-america-quake-repeater/
edit_uri: edit/next/docs/

docs_dir: .quake-site
site_dir: site-quake

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Understanding alerts:
      - Earthquake channel alerts: earthquake-alerts.md
      - What the sensor readings mean: reading-the-sensor.md
  - Reference:
      - The repeater's clock: clock-floor.md
      - D7S sensor integration: d7s-integration.md
      - Measurement contract: d7s-measurement-contract.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
